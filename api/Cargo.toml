[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.18.1"
serde = "1.0.229"
serde_json = "1.0.154"
actix-cors = "0.7.2"
argon2 = "0.6.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
chrono = { version = "0.4.45", features = ["serde"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
actix-multipart = "0.8.5"
uuid = { version = "1.29.0", features = ["v4"] }
futures-util = "0.3.34"
wasmtime = { version = "50.0.1", features = ["component-model", "pooling-allocator", "async"] }
wasmtime-wasi = "50.0.1"

anyhow = "1.0.104"
dotenv = "0.15.0"
thiserror = "2.0.21"
async-trait = "0.1.92"
papaya = "0.2.5"
ahash = "0.8.12"
tokio = { version = "1.54.1", features = ["full"] }
tracing-opentelemetry = "0.34.0"
opentelemetry = { version = "0.33.1", features = ["metrics", "trace", "logs"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing = "0.1.44"
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio", "metrics", "trace", "logs"] }
opentelemetry-otlp = { version = "0.33.1", features = ["grpc-tonic", "metrics", "trace", "logs"] }
clickhouse = { version = "0.15.3", features = ["test-util"] }
opentelemetry-appender-tracing = "0.33.1"
mimalloc = "0.1.52"

[dev-dependencies]
mockall = "0.15.0"
actix-rt = "2.15.0"
tempfile = "3.27.0"
actix-http = "3.20.0"
actix-test = "0.1.6"
