[package]
name = "fluor-cli"
version = "0.1.0"
edition = "2024"
description = "Command line client for a Fluor server"

[[bin]]
name = "fluor"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.54", features = ["derive", "env"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "multipart", "stream", "rustls-tls-webpki-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
